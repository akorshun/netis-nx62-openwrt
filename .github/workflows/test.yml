name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install busybox and mtd-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox mtd-utils

      - name: shellcheck
        run: shellcheck flash.sh tests/run.sh

      - name: Scenarios (dash + coreutils)
        run: sh tests/run.sh

      - name: Scenarios (busybox ash + busybox applets, real ubinize)
        run: |
          mkdir -p /tmp/bb
          busybox --install -s /tmp/bb
          SH="busybox sh" BB_PATH=/tmp/bb UBINIZE=real sh tests/run.sh
          ls -l tests/out-recovery.ubi

      # The runner kernel has no nandsim, so the image is parsed in userspace:
      # 128 KiB PEB, 2 KiB page without sub-pages (VID header at 2048, LEB
      # 126976), one dynamic volume "recovery" with id 2 holding the initramfs.
      - name: Validate the real UBI image
        run: |
          pip install --quiet ubi_reader
          ubireader_display_info tests/out-recovery.ubi | tee info.txt
          grep -q 'PEB Size: 131072' info.txt
          grep -q 'LEB Size: 126976' info.txt
          grep -q 'Min I/O: 2048' info.txt
          grep -q 'Vol ID: 2' info.txt
          grep -q 'vol_type: dynamic' info.txt
          grep -q 'reserved_pebs: 74' info.txt
          grep -q 'name: recovery' info.txt
          ! grep -E 'errors: \[.+\]' info.txt
          ubireader_extract_images -o ubi-out tests/out-recovery.ubi
          vol=$(find ubi-out -type f -name '*recovery*')
          head -c 9306112 "$vol" | sha256sum | tee sum.txt
          grep -q '^8ceee0b72589da501ee7e9e34628491a385a6b2f2cf87fec005b1af29cd843b3 ' sum.txt

      - uses: actions/upload-artifact@v4
        with:
          name: recovery-ubi
          path: tests/out-recovery.ubi
